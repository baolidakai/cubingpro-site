  <script>
    function getImageSrc(filename) {
      const id = filename.toLowerCase().replace('.', '_'); // e.g., "fmc.jpg" -> "fmc_jpg"
      const img = document.getElementById(id);
      return img ? img.src : null;
    }
    fetch("../../static/sidebar.json")
      .then(response => response.json())
      .then(menuData => {
        function buildMenu(menuContainer, menuData) {
          // State
          let inCategoryView = false;

          function renderCategories(data) {
            menuContainer.innerHTML = ''; // Clear previous

            data.forEach(entry => {
              const card = document.createElement('div');
              card.className = 'category-card';

              const img = document.createElement('img');
              img.src = getImageSrc(entry.category_logo);
              img.alt = entry.category;
              img.className = 'card-image';

              const title = document.createElement('div');
              title.className = 'card-title';
              title.textContent = entry.category;

              card.appendChild(img);
              card.appendChild(title);

              card.addEventListener('click', () => {
                renderItems(entry.category, entry.items);
              });

              menuContainer.appendChild(card);
            });

            inCategoryView = false;
          }

          function renderItems(category, items) {
            menuContainer.innerHTML = '';

            // Back button
            const backButton = document.createElement('button');
            backButton.textContent = '← Back';
            backButton.className = 'back-button';
            backButton.onclick = () => renderCategories(menuData);
            menuContainer.appendChild(backButton);

            items.forEach(item => {
              const card = document.createElement('div');
              card.className = 'item-card';

              const img = document.createElement('img');
              img.src = getImageSrc(item.logo);
              img.alt = item.title;
              img.className = 'card-image';

              const title = document.createElement('div');
              title.className = 'card-title';
              title.textContent = item.title;

              card.appendChild(img);
              card.appendChild(title);

              card.addEventListener('click', () => {
                window.location.href = window.__SITE_PREFIX__ + item.url.replace(/^\//, "");
              });

              menuContainer.appendChild(card);
            });

            inCategoryView = true;
          }

          // Initial render
          renderCategories(menuData);

          // Add copyright
          const copyright = document.createElement('div');
          copyright.className = 'copyright';
          copyright.textContent = '© 2025 Bowen Deng';
          menuContainer.appendChild(copyright);
        }

        const sidebarMenu = document.getElementById('sidebar-menu');
        const indexPage = document.getElementById('index-page');

        if (sidebarMenu) {
          buildMenu(sidebarMenu, menuData);
        }
        if (indexPage) {
          buildMenu(indexPage, menuData);
        }
      })
      .catch(err => console.error('Failed to load menu:', err));
  </script>

<script>
    const table = document.querySelector("table");

    // Create the header row
    const headerRow = document.createElement("tr");
    const emptyHeaderCell = document.createElement("td");
    headerRow.appendChild(emptyHeaderCell);

    for (let i = 0; i < 10; i++) {
        const headerCell = document.createElement("td");
        const canvas = document.createElement("canvas");
        canvas.id = `square-col-${i + 1}`;
        canvas.width = 100;
        canvas.height = 100;
        headerCell.appendChild(canvas);
        headerRow.appendChild(headerCell);
    }
    table.appendChild(headerRow);

    // Create the rest of the rows
    for (let i = 0; i < 10; i++) {
        const row = document.createElement("tr");

        const rowHeaderCell = document.createElement("td");
        const rowCanvas = document.createElement("canvas");
        rowCanvas.id = `square-row-${i + 1}`;
        rowCanvas.width = 100;
        rowCanvas.height = 100;
        rowHeaderCell.appendChild(rowCanvas);
        row.appendChild(rowHeaderCell);

        for (let j = 0; j < 10; j++) {
            const cell = document.createElement("td");
            const div = document.createElement("div");
            div.className = "matrix-cell";
            const p = document.createElement("p");
            p.id = `matrix-cell-${i + 1}-${j + 1}`;
            div.appendChild(p);
            cell.appendChild(div);
            row.appendChild(cell);
        }
        table.appendChild(row);
    }

    const patterns = [
        "21212121", "12122121", "21122112", "21211221", 
        "21121212", "22111122", "12212211", "11211222", 
        "12111222", "11121222"
    ];
    const cell_contents = [
        ["<p>1,1</p>", "<p>1,2</p>", "<p>1,3</p>", "<p>1,4</p>", "<p>1,5</p>", "<p>1,6</p>", "<p>1,7</p>", "<p>1,8</p>", "<p>1,9</p>", "<p>1,10</p>"],

    ];

    cell_contents.forEach((row, i) => {
        row.forEach((content, j) => {
            const cell = document.getElementById(`matrix-cell-${i + 1}-${j + 1}`);
            if (cell) {
                cell.innerHTML = content;
            }
        });
    });

    patterns.forEach((pattern, index) => {
        drawSquareShape(`square-row-${index + 1}`, pattern);
